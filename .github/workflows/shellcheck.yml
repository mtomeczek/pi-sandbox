---
name: ShellCheck

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Lint Bash scripts
        run: |
          shellcheck --shell=bash --severity=warning \
            pi-sandbox-create \
            pi-sandbox-run \
            pi-sandbox-setup \
            tests/allowed-roots.sh \
            tests/macos-compat.sh \
            tests/release-policy.sh \
            tests/setup.sh
      - name: Verify release policy defaults
        env:
          PODMAN_VERSION: 6.0.0
        run: bash tests/release-policy.sh
