---
name: Static analysis

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install ShellCheck
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          else
            brew install shellcheck
          fi
      - name: Lint Bash scripts
        run: |
          shellcheck --shell=bash --severity=warning \
            pi-sandbox-create \
            pi-sandbox-run \
            pi-sandbox-setup \
            tests/allowed-roots.sh \
            tests/macos-compat.sh \
            tests/release-policy.sh \
            tests/setup.sh
      - name: Verify release policy defaults
        env:
          PODMAN_VERSION: 6.0.0
        run: bash tests/release-policy.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: >-
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          -ErrorAction Stop
      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'pi-sandbox-create.ps1',
            'pi-sandbox-run.ps1',
            'scripts/windows/pi-sandbox-create.ps1',
            'scripts/windows/pi-sandbox-run.ps1'
          )
          $findings = foreach ($file in $files) {
            Invoke-ScriptAnalyzer -Path $file `
              -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($findings) {
            $findings | Format-Table ScriptName, Line, RuleName, Severity, `
              Message -AutoSize
            exit 1
          }
